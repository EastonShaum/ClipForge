[project]
name = "clipforge"
version = "0.1.0"
description = "Semi-automated short-form clipping pipeline: campaigns -> sources -> transcripts -> AI-picked clips -> human review."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.75",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "typer>=0.15",
    "yt-dlp>=2025.10.22",
]

[project.scripts]
clipforge = "clipforge.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 105
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI declares Form()/File()/Depends() in defaults by design

[tool.pytest.ini_options]
testpaths = ["tests"]
