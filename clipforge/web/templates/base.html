<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}ClipForge{% endblock %}</title>
<script>
// Dark by default; the nav switch stores a per-device choice. Runs before paint: no flash.
try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'; }
catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav>
  <a href="/campaigns" class="{{ 'on' if active in ('campaigns', 'campaign', 'bounty', 'queue', 'review', 'post', 'posted') }}">Campaigns</a>
  <a href="/scout" class="{{ 'on' if active == 'scout' }}">Scout</a>
  <a href="/dashboard" class="{{ 'on' if active == 'dashboard' }}">Dashboard</a>
  <button type="button" class="theme" onclick="toggleTheme()" aria-label="Switch light or dark theme">◐</button>
</nav>
<script>
// The bounty tabs stick just under the nav; its height changes with font size and wrapping.
(() => { const n = document.querySelector("nav"), set = () =>
  document.documentElement.style.setProperty("--nav-h", n.offsetHeight + "px");
  set(); addEventListener("resize", set); })();
</script>
<main>
  {% if msg %}<div class="msg" role="status">{{ msg }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
<script>
function toggleTheme() {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('theme', t); } catch (e) {}
}
// Copy that also works over plain http (navigator.clipboard needs https).
function copyText(id, btn) { copyValue(document.getElementById(id).value, btn); }
function copyValue(text, btn) {
  const done = () => { const t = btn.textContent; btn.textContent = "Copied ✓"; setTimeout(() => btn.textContent = t, 1500); };
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.cssText = "position:fixed;top:0;left:-9999px;font-size:16px";
    document.body.appendChild(ta); ta.focus(); ta.setSelectionRange(0, text.length);
    document.execCommand("copy"); ta.remove(); done();
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}
</script>
</body>
</html>
