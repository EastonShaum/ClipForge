<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}ClipForge{% endblock %}</title>
<script>
// Dark by default; the nav switch stores a per-device choice. Runs before paint: no flash.
try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'; }
catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav>
  <a href="/review" class="{{ 'on' if active == 'review' }}">Review</a>
  <a href="/approved" class="{{ 'on' if active == 'approved' }}">Post</a>
  <a href="/posts" class="{{ 'on' if active == 'posts' }}">Views</a>
  <a href="/campaigns" class="{{ 'on' if active in ('campaigns', 'campaign', 'queue') }}">Campaigns</a>
  <a href="/scout" class="{{ 'on' if active == 'scout' }}">Scout</a>
  <a href="/dashboard" class="{{ 'on' if active == 'dashboard' }}">Dashboard</a>
  <button type="button" class="theme" onclick="toggleTheme()" aria-label="Switch light or dark theme">◐</button>
</nav>
<main>
  {% if msg %}<div class="msg" role="status">{{ msg }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
<script>
function toggleTheme() {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('theme', t); } catch (e) {}
}
// Copy that also works over plain http (navigator.clipboard needs https).
function copyText(id, btn) {
  const el = document.getElementById(id);
  const done = () => { const t = btn.textContent; btn.textContent = "Copied ✓"; setTimeout(() => btn.textContent = t, 1500); };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(el.value).then(done, () => { el.select(); document.execCommand("copy"); done(); });
  } else { el.focus(); el.select(); document.execCommand("copy"); done(); }
}
</script>
</body>
</html>
